<!DOCTYPE html>
<html>
<head>
    <title>Movie Offline App</title>
    <script src="https://cdn.jsdelivr.net/npm/pouchdb@9.0.0/dist/pouchdb.min.js"></script>
</head>
<body>
    <h1>Movie Database</h1>
    
    <div>
        <h3>Create</h3>
        <input type="text" id="createId" placeholder="ID (e.g., 5000)">
        <input type="text" id="createTitle" placeholder="Title">
        <input type="text" id="createActors" placeholder="Actors (comma separated)">
        <input type="text" id="createGenres" placeholder="Genres (comma separated)">
        <button onclick="createMovie()">Create</button>
    </div>

    <div>
        <h3>Read</h3>
        <input type="text" id="readId" placeholder="ID">
        <button onclick="readMovie()">Read</button>
        <pre id="output"></pre>
    </div>

    <div>
        <h3>Update</h3>
        <input type="text" id="updateId" placeholder="ID">
        <input type="text" id="updateGenres" placeholder="New Genres (comma separated)">
        <button onclick="updateMovie()">Update</button>
    </div>

    <div>
        <h3>Delete</h3>
        <input type="text" id="deleteId" placeholder="ID">
        <button onclick="deleteMovie()">Delete</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
